<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anu's Birthday Invitation</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 500px;
      padding: 45px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
    }

    .emoji {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      color: #ff4081;
      font-size: 38px;
      margin-bottom: 10px;
    }

    h2 {
      color: #673ab7;
      font-size: 42px;
      margin-bottom: 15px;
    }

    .message {
      color: #555;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .details {
      background: #fff0f5;
      border-radius: 15px;
      padding: 18px;
      margin: 20px 0;
      color: #444;
      font-size: 17px;
      line-height: 1.8;
    }

    .btn {
      border: none;
      padding: 13px 25px;
      border-radius: 30px;
      background: #ff4081;
      color: white;
      font-size: 17px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #e91e63;
      transform: scale(1.05);
    }

    .balloon {
      position: absolute;
      font-size: 45px;
      animation: float 4s ease-in-out infinite;
    }

    .b1 { left: 5%; top: 10%; }
    .b2 { right: 5%; top: 15%; animation-delay: 1s; }
    .b3 { left: 10%; bottom: 10%; animation-delay: 2s; }
    .b4 { right: 10%; bottom: 8%; animation-delay: 1.5s; }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-25px);
      }
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div class="balloon b1">🎈</div>
  <div class="balloon b2">🎈</div>
  <div class="balloon b3">🎈</div>
  <div class="balloon b4">🎈</div>

  <canvas id="confetti"></canvas>

  <div class="card">
    <div class="emoji">🎂🎉</div>

    <h1>You're Invited!</h1>

    <h2>Anu</h2>

    <p class="message">
      Join us as we celebrate the wonderful birthday of
      <strong>Anu</strong>!
      <br>
      Let's make this special day full of happiness,
      laughter and beautiful memories. ❤️
    </p>

    <div class="details">
      📅 <strong>Date:</strong> 15 September 2026<br>
      ⏰ <strong>Time:</strong> 6:00 PM<br>
      📍 <strong>Venue:</strong> Celebration Hall
    </div>

    <button class="btn" onclick="celebrate()">
      🎊 Celebrate!
    </button>
  </div>

  <script>
    function celebrate() {
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let pieces = [];

      for (let i = 0; i < 180; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: -20,
          size: Math.random() * 8 + 4,
          speed: Math.random() * 5 + 3,
          angle: Math.random() * 360
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        pieces.forEach(p => {
          p.y += p.speed;
          p.angle += 5;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle * Math.PI / 180);

          ctx.fillStyle =
            `hsl(${Math.random() * 360}, 90%, 60%)`;

          ctx.fillRect(
            -p.size / 2,
            -p.size / 2,
            p.size,
            p.size
          );

          ctx.restore();
        });

        pieces = pieces.filter(p => p.y < canvas.height);

        if (pieces.length > 0) {
          requestAnimationFrame(animate);
        }
      }

      animate();
    }
  </script>

</body>
</html>
